name: Build and Push Mendix App to Docker Hub

on:
  push:
    branches:
      - main  # Triggers the build whenever code is pushed to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image with 'latest' and the specific commit SHA
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/mendix-app:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/mendix-app:${{ github.sha }}
          
          # Mendix Buildpack specific build arguments
          build-args: |
            BUILD_PATH=./  
            PROJECT_FILE=YourProjectName.mpr
